<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">

<title>恋爱牌</title>

<meta name="theme-color" content="#fcecf3">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "PingFang SC",
        "Microsoft YaHei",
        sans-serif;
    color:#5f4652;
}

body{
    background:
        radial-gradient(
            circle at 50% -10%,
            #ffffff 0%,
            #fff8fb 35%,
            #fcecf3 70%,
            #f8e3ed 100%
        );
}

button,
input,
textarea{
    font-family:inherit;
}

button{
    cursor:pointer;
    -webkit-user-select:none;
    user-select:none;
    touch-action:manipulation;
}

.page{
    position:absolute;
    inset:0;
    overflow:hidden;
}


/* =====================================================
   背景
   ===================================================== */

.glow{
    position:absolute;
    border-radius:50%;
    filter:blur(55px);
    pointer-events:none;
}

.glow.one{
    width:180px;
    height:180px;
    background:rgba(255,190,211,.27);
    top:-60px;
    left:-50px;
}

.glow.two{
    width:220px;
    height:220px;
    background:rgba(248,211,225,.28);
    right:-80px;
    top:25%;
}

.glow.three{
    width:190px;
    height:190px;
    background:rgba(255,220,231,.30);
    bottom:-80px;
    left:20%;
}

.heart{
    position:absolute;
    color:rgba(213,130,158,.15);
    font-family:serif;
    pointer-events:none;
    user-select:none;
}

.heart.h1{
    top:13%;
    left:8%;
    font-size:20px;
    transform:rotate(-15deg);
}

.heart.h2{
    top:27%;
    right:9%;
    font-size:15px;
    transform:rotate(18deg);
}

.heart.h3{
    bottom:22%;
    left:10%;
    font-size:17px;
    transform:rotate(12deg);
}

.heart.h4{
    bottom:12%;
    right:12%;
    font-size:22px;
    transform:rotate(-12deg);
}


/* =====================================================
   首页
   ===================================================== */

#homePage{
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:
        calc(env(safe-area-inset-top) + 28px)
        24px
        calc(env(safe-area-inset-bottom) + 28px);
}

.home-title{
    text-align:center;
    flex-shrink:0;
}

.home-title .en{
    font-family:Georgia,serif;
    font-size:11px;
    letter-spacing:4px;
    color:#c58ca2;
    margin-bottom:9px;
}

.home-title h1{
    margin:0;
    font-family:
        "STKaiti",
        "KaiTi",
        "FZKai-Z03",
        serif;
    font-size:40px;
    font-weight:400;
    letter-spacing:7px;
    color:#654957;
}

.home-title p{
    margin:12px 0 0;
    font-family:
        "STKaiti",
        "KaiTi",
        serif;
    font-size:14px;
    letter-spacing:1px;
    color:#a77c8d;
}

.home-card-area{
    flex:1;
    width:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:0;
    margin-top:-12px;
    padding-bottom:8px;
}

.card-stack{
    position:relative;
    width:190px;
    height:270px;
    animation:cardFloat 4s ease-in-out infinite;
}

.stack-card{
    position:absolute;
    width:190px;
    height:270px;
    border-radius:22px;
    box-shadow:0 18px 45px rgba(143,84,108,.13);
}

.stack-card.back1{
    background:linear-gradient(145deg,#f3d8e3,#edd0dd);
    transform:translate(-12px,7px) rotate(-7deg);
}

.stack-card.back2{
    background:linear-gradient(145deg,#f8e8ee,#f2dce6);
    transform:translate(12px,5px) rotate(7deg);
}

.main-card{
    position:absolute;
    inset:0;
    border-radius:22px;
    background:
        radial-gradient(
            circle at 20% 15%,
            rgba(255,255,255,.9),
            transparent 32%
        ),
        linear-gradient(145deg,#fffdfd,#fdf0f5);
    box-shadow:
        0 20px 50px rgba(143,84,108,.17),
        inset 0 0 0 1px rgba(255,255,255,.9);
    overflow:hidden;
}

.main-card:before{
    content:"";
    position:absolute;
    inset:10px;
    border:1px solid rgba(193,132,155,.25);
    border-radius:16px;
    pointer-events:none;
}

.corner{
    position:absolute;
    color:#d7a4b8;
    font-family:serif;
    font-size:13px;
}

.corner.c1{top:18px;left:18px}
.corner.c2{top:18px;right:18px}
.corner.c3{bottom:18px;left:18px}
.corner.c4{bottom:18px;right:18px}

.card-center{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    width:82px;
    height:82px;
    border-radius:50%;
    background:rgba(246,214,226,.45);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:34px;
    color:#d38da9;
}

.main-card .love-card-title{
    position:absolute;
    left:0;
    right:0;
    bottom:46px;
    text-align:center;
    font-family:"STKaiti","KaiTi",serif;
    font-size:24px;
    letter-spacing:5px;
    color:#765261;
}

.main-card .love-card-sub{
    position:absolute;
    left:0;
    right:0;
    bottom:23px;
    text-align:center;
    font-family:Georgia,serif;
    font-size:7px;
    letter-spacing:2px;
    color:#c08aa0;
}

@keyframes cardFloat{
    0%,100%{transform:translateY(0)}
    50%{transform:translateY(-8px)}
}

.card-stack{
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
    transition:transform .38s cubic-bezier(.22,.8,.25,1);
}

.card-stack:active,
.card-stack.pressed{
    animation:none;
    transform:scale(.97);
    transition:transform .32s cubic-bezier(.22,.8,.25,1);
}

.home-actions{
    width:100%;
    flex-shrink:0;
    display:flex;
    flex-direction:row;
    align-items:center;
    justify-content:center;
    gap:28px;
    padding-top:4px;
}

.home-actions .secondary-btn{
    min-width:108px;
    text-align:center;
}

.primary-btn{
    width:min(280px,86vw);
    height:52px;
    border:none;
    border-radius:28px;
    background:linear-gradient(135deg,#d993ad,#c77f9b);
    color:white;
    font-size:15px;
    letter-spacing:2px;
    box-shadow:0 10px 25px rgba(190,113,143,.22);
}

.primary-btn:active{
    transform:scale(.97);
}

.secondary-btn{
    border:none;
    background:transparent;
    color:#ad7c8e;
    font-size:13px;
    letter-spacing:1px;
    padding:5px 12px;
}


/* =====================================================
   通用页面
   ===================================================== */

.sub-page{
    display:none;
    flex-direction:column;
    padding:
        calc(env(safe-area-inset-top) + 15px)
        18px
        calc(env(safe-area-inset-bottom) + 20px);
}

.page-header{
    position:relative;
    width:100%;
    height:48px;
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:center;
}

.page-header-title{
    font-family:"STKaiti","KaiTi",serif;
    font-size:21px;
    letter-spacing:4px;
    color:#684c59;
}


/* =====================================================
   我的卡牌
   ===================================================== */

#collectionPage{
    background:
        radial-gradient(
            circle at 50% -10%,
            #ffffff 0%,
            #fff8fb 35%,
            #fcecf3 70%,
            #f8e3ed 100%
        );
}

.collection-intro{
    flex-shrink:0;
    margin-top:10px;
    padding:0 5px;
}

.collection-intro h2{
    margin:0;
    font-size:20px;
    font-weight:500;
    color:#684b58;
}

.collection-intro p{
    margin:7px 0 0;
    font-size:12px;
    color:#a98a96;
}

.category-list{
    flex:1;
    min-height:0;
    overflow-y:auto;
    padding:18px 2px 10px;
    scrollbar-width:none;
}

.category-list::-webkit-scrollbar{
    display:none;
}

.category-item{
    width:100%;
    min-height:72px;
    border:1px solid rgba(213,177,191,.25);
    border-radius:16px;
    background:rgba(255,255,255,.72);
    margin-bottom:10px;
    padding:12px 14px;
    display:flex;
    align-items:center;
    text-align:left;
    box-shadow:0 5px 18px rgba(143,84,108,.05);
    transition:transform .15s ease,background .15s ease;
}

.category-item:active{
    transform:scale(.985);
    background:rgba(255,255,255,.9);
}

.category-icon{
    width:42px;
    height:42px;
    border-radius:13px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:21px;
    flex-shrink:0;
    margin-right:12px;
}

.category-item:nth-child(1) .category-icon{background:#edf6dc}
.category-item:nth-child(2) .category-icon{background:#f8e5ed}
.category-item:nth-child(3) .category-icon{background:#f9e4df}
.category-item:nth-child(4) .category-icon{background:#e6edf8}
.category-item:nth-child(5) .category-icon{background:#ece5f2}
.category-item:nth-child(6) .category-icon{background:#fff0d7}

.category-info{
    flex:1;
    min-width:0;
}

.category-name{
    font-size:16px;
    font-weight:500;
    color:#6b4e5b;
}

.category-count{
    margin-top:5px;
    font-size:11px;
    color:#ad929d;
}

.category-arrow{
    color:#c391a4;
    font-size:22px;
    margin-left:8px;
}

.collection-bottom{
    flex-shrink:0;
    text-align:center;
    padding:5px 0 3px;
}

.collection-total{
    font-size:10px;
    color:#b99aa7;
    letter-spacing:1px;
}

.reset-round-btn{
    height:40px;
    min-width:140px;
    padding:0 22px;
    border:1px solid rgba(193,132,155,.28);
    border-radius:22px;
    background:rgba(255,255,255,.62);
    color:#a87387;
    font-size:13px;
    letter-spacing:2px;
    box-shadow:0 6px 16px rgba(150,90,112,.08);
}

.reset-round-btn:active{
    transform:scale(.96);
}


/* =====================================================
   编辑
   ===================================================== */

#editorPage{
    display:none;
    flex-direction:column;
}

.editor-summary{
    flex-shrink:0;
    margin:10px 0 14px;
    padding-left:3px;
}

.editor-summary-top{
    display:flex;
    align-items:center;
}

.editor-summary-icon{
    width:42px;
    height:42px;
    border-radius:13px;
    background:rgba(255,255,255,.72);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:22px;
    margin-right:10px;
}

.editor-summary-name{
    font-size:20px;
    font-weight:500;
    color:#684c59;
}

.editor-summary-count{
    margin-top:4px;
    font-size:11px;
    color:#ad929d;
}

.add-content-box{
    flex-shrink:0;
    width:100%;
    background:rgba(255,255,255,.72);
    border:1px solid rgba(213,177,191,.25);
    border-radius:17px;
    padding:12px;
    box-shadow:0 5px 18px rgba(143,84,108,.05);
}

.content-input{
    display:block;
    width:100%;
    height:150px;
    min-height:150px;
    max-height:240px;
    resize:vertical;
    border:1px solid rgba(208,173,188,.25);
    outline:none;
    border-radius:13px;
    background:#fbf3f7;
    padding:13px;
    font-size:15px;
    line-height:1.75;
    color:#705563;
}

.content-input:focus{
    border-color:rgba(195,132,158,.45);
    background:#fffafd;
}

.content-input::placeholder{
    color:#bda5af;
}

.add-content-row{
    display:flex;
    justify-content:flex-end;
    margin-top:10px;
}

.add-btn{
    height:40px;
    padding:0 22px;
    border:none;
    border-radius:20px;
    background:linear-gradient(135deg,#d993ad,#c77f9b);
    color:white;
    font-size:13px;
    box-shadow:0 6px 15px rgba(190,113,143,.16);
}

.add-btn:active{
    transform:scale(.96);
}

.content-list{
    flex:1;
    min-height:0;
    overflow-y:auto;
    margin-top:13px;
    padding:0 1px 20px;
    scrollbar-width:none;
}

.content-list::-webkit-scrollbar{
    display:none;
}

.content-empty{
    padding-top:55px;
    text-align:center;
    color:#b99da8;
}

.content-empty-icon{
    font-size:27px;
    margin-bottom:9px;
}

.content-empty-text{
    font-size:12px;
    line-height:1.8;
}


/* =====================================================
   内容列表
   ===================================================== */

.content-item{
    width:100%;
    min-height:46px;
    margin-bottom:7px;
    padding:8px 8px 8px 9px;

    display:grid;
    grid-template-columns:32px minmax(0,1fr) 30px;
    align-items:center;
    column-gap:5px;

    background:rgba(255,255,255,.72);
    border:1px solid rgba(213,177,191,.2);
    border-radius:11px;

    box-shadow:0 3px 10px rgba(143,84,108,.035);
}

.content-number{
    width:32px;
    min-width:32px;
    height:26px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:8px;
    background:rgba(246,224,233,.55);

    color:#ad7d90;
    font-size:12px;
    font-weight:500;
    line-height:1;

    white-space:nowrap;
}

.content-text{
    min-width:0;
    display:block;

    font-size:14px;
    line-height:1.55;
    color:#735764;

    white-space:pre-wrap;
    word-break:break-word;

    cursor:pointer;
    user-select:none;
    -webkit-user-select:none;
}

.content-text:active{
    opacity:.7;
}

.item-actions{
    width:30px;
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
}

.item-action.delete-action{
    width:28px;
    height:28px;

    border:1px solid rgba(190,143,160,.35);
    border-radius:7px;

    background:rgba(255,248,251,.9);
    color:#b78396;

    font-size:18px;
    font-weight:300;
    line-height:1;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:0;
}

.item-action.delete-action:active{
    transform:scale(.9);
    background:#f8e8ee;
}


/* =====================================================
   删除弹窗
   ===================================================== */

.delete-modal{
    position:fixed;
    inset:0;
    z-index:400;

    display:none;
    align-items:center;
    justify-content:center;

    background:rgba(81,48,62,.24);

    backdrop-filter:blur(7px);
    -webkit-backdrop-filter:blur(7px);

    padding:25px;
}

.delete-modal.show{
    display:flex;
}

.delete-box{
    width:180px;
    background:linear-gradient(145deg,#fffefe,#f9edf2);
    border-radius:20px;
    padding:10px;

    box-shadow:0 20px 50px rgba(75,38,53,.22);

    display:flex;
    flex-direction:column;
    gap:8px;
}

.delete-confirm-btn,
.delete-cancel-btn{
    width:100%;
    height:42px;
    border-radius:14px;
    font-size:14px;
    border:1px solid rgba(193,132,155,.22);
    background:white;
    color:#ad7c8e;
}

.delete-confirm-btn{
    border:none;
    color:white;
    background:linear-gradient(135deg,#d993ad,#c77f9b);
}

.delete-confirm-btn:active,
.delete-cancel-btn:active{
    transform:scale(.97);
}


/* =====================================================
   游戏
   ===================================================== */

#drawPage{
    display:none;
    flex-direction:column;
    padding:
        calc(env(safe-area-inset-top) + 20px)
        18px
        calc(env(safe-area-inset-bottom) + 24px);
}

.draw-header{
    position:relative;
    width:100%;
    height:42px;
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:center;
}

.draw-header-title{
    font-family:"STKaiti","KaiTi",serif;
    font-size:21px;
    letter-spacing:4px;
    color:#684c59;
}

.draw-divider{
    width:48px;
    height:1px;
    margin:8px auto 0;
    background:linear-gradient(
        90deg,
        transparent,
        rgba(196,154,170,.45),
        transparent
    );
    flex-shrink:0;
}

.draw-status{
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    margin-top:12px;
    padding:0 10px;
    width:100%;
    max-width:360px;
    margin-left:auto;
    margin-right:auto;
    box-sizing:border-box;
}

.status-chip{
    font-size:11px;
    letter-spacing:1px;
    color:#c49aaa;
    background:rgba(255,255,255,.5);
    border:1px solid rgba(213,177,191,.22);
    border-radius:10px;
    padding:4px 10px;
    white-space:nowrap;
    line-height:1.3;
    text-align:center;
}

.status-chip.status-side{
    min-width:96px;
}

.status-chip.status-center{
    flex:0 0 auto;
}

.bottom-meta{
    flex-shrink:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
    margin-top:4px;
    opacity:1;
    transition:opacity .3s ease;
    pointer-events:none;
}

.bottom-meta.hide{
    opacity:0;
}

.turn-pill{
    font-family:"STKaiti","KaiTi",serif;
    font-size:12px;
    letter-spacing:3px;
    color:#c49aaa;
    padding:4px 14px;
    border-radius:12px;
    background:rgba(255,255,255,.45);
    border:1px solid rgba(213,177,191,.2);
}

.cards-board{
    width:100%;
    flex:1;
    min-height:0;
    position:relative;

    display:grid;
    grid-template-columns:repeat(3,1fr);
    grid-template-rows:repeat(3,auto);

    gap:14px 9px;

    align-content:center;
    justify-items:center;

    padding:6px 5px;
}

.cards-board.phase-priority{
    display:flex;
    align-items:center;
    justify-content:center;
}

.cards-board.phase-priority .love-card{
    max-width:120px;
}

.love-card.dealing{
    transition:
        transform .55s cubic-bezier(.22,.8,.25,1),
        opacity .4s ease;
}

.love-card.collecting{
    transition:
        transform .45s cubic-bezier(.4,.0,.2,1),
        opacity .35s ease;
}

@keyframes cardShake{
    0%,100%{transform:translate(0,0) rotate(0deg)}
    15%{transform:translate(-3px,2px) rotate(-2deg)}
    30%{transform:translate(3px,-2px) rotate(2deg)}
    45%{transform:translate(-2px,-1px) rotate(-1deg)}
    60%{transform:translate(2px,2px) rotate(1deg)}
    75%{transform:translate(-1px,1px) rotate(-1deg)}
}

.love-card.shaking{
    animation:cardShake .45s ease-in-out;
}

.love-card{
    position:relative;
    width:100%;
    max-width:108px;
    aspect-ratio:.705;

    border-radius:17px;
    border:0;
    padding:0;

    background:none;

    perspective:900px;

    transition:
        transform .25s ease,
        opacity .25s ease;
}

.love-card:active{
    transform:scale(.94);
}

.love-card-inner{
    position:absolute;
    inset:0;
    border-radius:17px;

    transform-style:preserve-3d;

    transition:
        transform .65s cubic-bezier(.2,.8,.2,1);
}

.love-card.flipped .love-card-inner{
    transform:rotateY(180deg);
}

.card-face{
    position:absolute;
    inset:0;

    border-radius:17px;

    backface-visibility:hidden;
    -webkit-backface-visibility:hidden;

    overflow:hidden;
}

.card-back{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    box-shadow:0 10px 25px rgba(130,75,98,.13);
}

.card-back:before{
    content:"";
    position:absolute;
    inset:7px;
    border-radius:12px;
    border:1px solid rgba(255,255,255,.48);
    pointer-events:none;
}

.back-symbol{
    font-family:Georgia,serif;
    font-size:27px;
    color:rgba(255,255,255,.88);
    margin-bottom:10px;
}

.back-label{
    font-family:Georgia,serif;
    font-size:7px;
    letter-spacing:2px;
    color:rgba(255,255,255,.8);
}

.card-color-1 .card-back{
    background:linear-gradient(145deg,#B7E35A,#8FBE35);
}

.card-color-2 .card-back{
    background:linear-gradient(145deg,#B84A3A,#8F3028);
}

.card-color-3 .card-back{

    try{

            return { girlDrinks:0, boyDrinks:0 };

        const parsed = JSON.parse(raw);

        const g = Number(parsed.girlDrinks);
        const b = Number(parsed.boyDrinks);

        return {
            girlDrinks:
                Number.isFinite(g) && g >= 0
                    ? Math.floor(g)
                    : 0,
            boyDrinks:
                Number.isFinite(b) && b >= 0
                    ? Math.floor(b)
                    : 0
        };

    }catch(error){

        return { girlDrinks:0, boyDrinks:0 };

    }

}

    try{

        if(!saved){

        if(!saved){
            return createDefaultData();
        }

        const parsed =
            JSON.parse(saved);

        const data =
            createDefaultData();

        categories.forEach(category => {

            if(Array.isArray(parsed[category.id])){

                data[category.id] =
                    parsed[category.id]
                        .map(normalizeCardItem)
                        .filter(item => item.text.trim() !== "");

            }

        });

        return data;

    }catch(error){

        return createDefaultData();

    }

}

/*
 * 使用浏览器自带的 Web Audio API。
 *
 * 不需要外部音频文件。
 * 不需要网络。
 *
 * 倒计时结束时：
 * 滴 —— 滴 —— 滴
 *
 * 总时长约 2 秒。
 */

let audioContext = null;

function playTimerFinishedSound(){

    try{

        const AudioContext =
            window.AudioContext ||
            window.webkitAudioContext;

        if(!AudioContext){
            return;
        }

        if(!audioContext){

            audioContext =
                new AudioContext();

        }

        if(audioContext.state === "suspended"){

            audioContext.resume();

        }

        const now =
            audioContext.currentTime;

        /*
         * 三声提示音
         *
         * 每一声：
         * 约 0.18 秒
         *
         * 间隔：
         * 约 0.48 秒
         */

        const beepTimes = [
            0,
            0.55,
            1.10
        ];

        beepTimes.forEach((offset,index) => {

            const oscillator =
                audioContext.createOscillator();

            const gain =
                audioContext.createGain();

            oscillator.type = "sine";

            /*
             * 三声略微不同，
             * 听起来更自然。
             */
            oscillator.frequency.value =
                index === 2 ? 880 : 820;

            gain.gain.setValueAtTime(
                0,
                now + offset
            );

            gain.gain.linearRampToValueAtTime(
                0.16,
                now + offset + 0.025
            );

            gain.gain.linearRampToValueAtTime(
                0,
                now + offset + 0.20
            );

            oscillator.connect(gain);
            gain.connect(audioContext.destination);

            oscillator.start(
                now + offset
            );

            oscillator.stop(
                now + offset + 0.22
            );

        });

    }catch(error){

        /*
         * 如果手机浏览器不支持音频，
         * 不影响倒计时和游戏其他功能。
         */

    }

}

function goBackLayer(){

    /* UI 主动关闭时同步 history，避免栈错位 */
    if(
        history.state &&
        history.state.loveCard === true &&
        (
            history.state.page === "card" ||
            history.state.page === "timer"
        )
    ){

        historySyncLock = true;
        history.back();

        setTimeout(function(){
            historySyncLock = false;
        },80);

    }

}

    if(historySyncLock){
        return;
    }

    const state =
        event.state && event.state.loveCard === true
            ? event.state
            : null;

    const page =
        state ? state.page : null;

    /*
     * 1) 倒计时打开 → 只关倒计时（history 已回到 card）

        return;

     * 2) 大卡打开 → 只关大卡，留在抽卡页（history 已回到 draw）
     */
    if(isCardOverlayOpen()){

        closeCard(true, true);
        currentPage = "draw";
        showOnlyPage("draw");
        return;

    }

    /*
     * 3) 抽卡页 → 回主页
     */
    if(currentPage === "draw"){

        saveCurrentRound();
        currentPage = "home";
        showOnlyPage("home");

        if(page !== "home"){

            history.replaceState(
                {
                    loveCard:true,
                    page:"home"
                },
                "",
                location.href
            );

        }

        return;

    }

    /*
     * 4) 编辑页 → 回设置列表
     */
    if(currentPage === "editor"){

        backCollection();

        if(page !== "collection"){

            history.replaceState(
                {
                    loveCard:true,
                    page:"collection"
                },
                "",
                location.href
            );

        }

        return;

    }

    /*
     * 5) 设置页 → 回主页
     */
    if(currentPage === "collection"){

        saveCurrentRound();
        currentPage = "home";
        showOnlyPage("home");

        if(page !== "home"){

            history.replaceState(
                {
                    loveCard:true,
                    page:"home"
                },
                "",
                location.href
            );

        }

        return;

    }

    /*
     * 6) 主页或其它 → 停在主页（不再继续退出）
     */
    saveCurrentRound();
    currentPage = "home";
    showOnlyPage("home");

    history.pushState(
        {
            loveCard:true,
            page:"home"
        },
        "",
        location.href
    );

});

/* =====================================================

function escapeHTML(text){

    return String(text)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}

function parseUnlockRound(value){

    const n = Number(value);

    if(!Number.isFinite(n) || n < 1){
        return 1;
    }

    return Math.min(999,Math.floor(n));

}

/* =====================================================
   Fisher-Yates
   ===================================================== */

function shuffleArray(array){

    const result = [...array];

    for(
        let i = result.length - 1;
        i > 0;
        i--
    ){

        const j =
            Math.floor(
                Math.random() * (i + 1)
            );

        [
            result[i],
            result[j]
        ] =
        [
            result[j],
            result[i]
        ];

    }

    return result;

}

function startPriorityPhase(){

    gamePhase = "priority";
    isPriorityCard = false;
    dealBusy = false;

    const board =
        document.getElementById("cardsBoard");

    board.className = "cards-board phase-priority";
    board.innerHTML = "";

    /*
     * 每轮重新随机。
     * 使用 crypto 增强随机；若连续两轮同一边，第三轮强制换边，避免手感偏差。
     */
    let isGirl = true;

    try{

        if(window.crypto && crypto.getRandomValues){

            const buf = new Uint32Array(1);
            crypto.getRandomValues(buf);
            isGirl = (buf[0] % 2) === 0;

        }else{

            isGirl = Math.random() < 0.5;

        }

    }catch(error){

        isGirl = Math.random() < 0.5;

    }

    if(
        recentPrioritySides.length >= 2 &&
        recentPrioritySides[0] === recentPrioritySides[1]
    ){

        const last =
            recentPrioritySides[1];

        if(
            (last === "girl" && isGirl) ||
            (last === "boy" && !isGirl)
        ){
            isGirl = !isGirl;
        }

    }

    const side =
        isGirl ? "girl" : "boy";

    recentPrioritySides.push(side);

    if(recentPrioritySides.length > 2){
        recentPrioritySides.shift();
    }

    const priorityCard = {
        categoryId:"priority",
        type: isGirl ? "女孩牌" : "男生牌",
        icon: isGirl ? "♀" : "♂",
        english: isGirl ? "LADY FIRST" : "GENT FIRST",
        symbol: isGirl ? "♡" : "✦",
        description: isGirl
            ? "女士优先"
            : "男士优先",
        color: isGirl ? "card-color-9" : "card-color-5",
        isPriority:true,
        prioritySide: side
    };

    /* 暂存到 index 0 供 openCard 使用 */
    currentRoundCards._priority = priorityCard;

    const button =
        document.createElement("button");

    button.type = "button";
    button.className =
        "love-card " + priorityCard.color;
    button.dataset.index = "priority";

    button.innerHTML = `

                <div class="card-icon">
                    ${priorityCard.icon}
                </div>

                <div class="card-name">
                    先后牌
                </div>


            </div>

        </div>

    `;

    button.addEventListener("click", function(event){

        event.preventDefault();
        event.stopPropagation();

        openPriorityCard(priorityCard);

    });

    board.appendChild(button);

    shuffleArea.classList.remove("show");
    updateRoundDisplay();
    updateDrawProgress();

}

function runCollectThenPriority(){

    dealBusy = true;

        document.getElementById("cardsBoard");

        board.querySelectorAll(".love-card");

    if(!cards.length){

    const boardRect =

            rect.top - boardRect.top + rect.height / 2;

        const dy = cy - cardCy;

        board.style.opacity = "";

        startPriorityPhase();

/* =====================================================
   时间解析
   ===================================================== */

function parseTimer(text){

    const source =
        String(text);

    const explicit =
        source.match(
            /[【\[]\s*(?:计时|倒计时)\s*[:：]\s*(?:(\d+)\s*分(?:钟)?\s*)?(?:(\d+)\s*秒)?\s*[】\]]/i
        );

    if(explicit){

        const minutes =
            Number(explicit[1] || 0);

        const seconds =
            Number(explicit[2] || 0);

        const total =
            minutes * 60 + seconds;

        if(
            total > 0 &&
            total <= 3600
        ){

            return {

                seconds:total,

                display:
                    source
                        .replace(explicit[0],"")
                        .trim()

            };

        }

    }


    const minuteSecond =
        source.match(
            /(\d+)\s*分(?:钟)?\s*(\d+)\s*秒/
        );

    if(minuteSecond){

        const total =
            Number(minuteSecond[1]) * 60 +
            Number(minuteSecond[2]);

        if(
            total > 0 &&
            total <= 3600
        ){

            return {
                seconds:total,
                display:source
            };

        }

    }


    const minutesOnly =
        source.match(
            /(\d+)\s*分钟?/
        );

    if(minutesOnly){

        const total =
            Number(minutesOnly[1]) * 60;

        if(
            total > 0 &&
            total <= 3600
        ){

            return {
                seconds:total,
                display:source
            };

        }

    }


    const secondsOnly =
        source.match(
            /(\d+)\s*秒/
        );

    if(secondsOnly){

        const total =
            Number(secondsOnly[1]);

        if(
            total > 0 &&
            total <= 3600
        ){

            return {
                seconds:total,
                display:source
            };

        }

    }

    return null;

}


/* =====================================================
   时间格式
   ===================================================== */

function formatTime(totalSeconds){

    const safe =
        Math.max(
            0,
            Math.floor(totalSeconds)
        );

    const minutes =
        Math.floor(safe / 60);

    const seconds =
        safe % 60;

    return (
        String(minutes).padStart(2,"0") +
        ":" +
        String(seconds).padStart(2,"0")
    );

}

    if(
        cardOpening ||
        cardCloseLocked ||
        timerActive ||
        timerAwaitingConfirm ||
        dealBusy ||
        gamePhase !== "playing"
    ){
        return;
    }

    const card =
        currentRoundCards[index];

    if(!card){
        return;
    }

    const smallCard =
        document.querySelector(
            `.love-card[data-index="${index}"]`
        );

    if(!smallCard){
        return;
    }

    const alreadyOpened =
        smallCard.classList.contains("flipped");

    currentCardIndex = index;

    if(!alreadyOpened){

        /*
         * 开始抽牌。
         *
         * 从这里开始：
         * cardOpening = true
         * cardCloseLocked = true
         *
         * 所以整个动画期间，
         * 点击外部都不会关闭。
         */
        cardOpening = true;

        cardCloseLocked = true;

        clearTimeout(cardCloseUnlockTimer);

        cardCloseUnlockTimer = null;

        overlay.classList.remove("instant");

        bigCard.classList.remove("reveal");

        bigCardWrap.classList.remove("spinning");

        fillBigCard(card);

        mediumVibrate();

        overlay.style.display = "flex";

        if(
            !history.state ||
            history.state.page !== "card"
        ){
            pushLayer("card");
        }

        requestAnimationFrame(() => {

            overlay.classList.add("show");

        });

        /*
         * 250ms 后开始旋转动画。
         */
        setTimeout(() => {

            if(!overlay.classList.contains("show")){
                return;
            }

            bigCardWrap.classList.add("spinning");

        },250);


        /*
         * 1400ms：
         * 原本的抽牌动画结束，
         * 让大卡牌翻到正面。
         *
         * 但是这里仍然不能关闭。
         *
         * 接下来继续锁定 1000ms。
         */
        setTimeout(() => {

            if(!overlay.classList.contains("show")){

                cardOpening = false;

                cardCloseLocked = false;

                return;

            }

            bigCardWrap.classList.remove("spinning");

            bigCard.classList.add("reveal");

            cardOpening = false;

            /*
             * 翻牌完成后继续锁定 1 秒。
             */
            cardCloseLocked = true;

            clearTimeout(cardCloseUnlockTimer);

            cardCloseUnlockTimer =
                setTimeout(() => {

                    cardCloseLocked = false;

                    cardCloseUnlockTimer = null;

                },1000);

        },1400);

        return;

    }


    /*
     * 已经翻过的卡牌：允许直接点外部关闭。
     */
    cardOpening = false;

    cardCloseLocked = false;

    clearTimeout(cardCloseUnlockTimer);

    cardCloseUnlockTimer = null;

    fillBigCard(card);

    if(currentCardHasTimer){
        timerDoneForCurrentCard = true;
    }

    overlay.classList.add("instant");

    overlay.style.display = "flex";

    if(
        !history.state ||
        history.state.page !== "card"
    ){
        pushLayer("card");
    }

    requestAnimationFrame(() => {

        overlay.classList.add("show");

        bigCard.classList.add("reveal");

    });

}


/* =====================================================
   填充大卡
   ===================================================== */

function fillBigCard(card){

    bigBack.className =
        "big-face big-back";

    bigBack.classList.add(card.color);

    bigSymbol.textContent =
        card.symbol;

    bigBackTitle.textContent =
        card.type;

    bigBackEn.textContent =
        card.english;

    bigType.textContent =
        card.english.replace(" CARD","");

    bigIcon.textContent =
        card.icon;

    bigTitle.textContent =
        card.type;


    const timerInfo =
        parseTimer(card.description);

    const rawText =
        timerInfo
            ? timerInfo.display
            : card.description;

    bigDescription.innerHTML =
        formatDescriptionHTML(rawText);


    if(timerInfo){

        timerSeconds =
            timerInfo.seconds;

        currentCardHasTimer = true;
        timerDoneForCurrentCard = false;
        timerAwaitingConfirm = false;

        timerStartBtn.textContent =
            "⏱ 开始倒计时 · " +
            formatTime(timerInfo.seconds);

        timerAction.classList.add("show");

    }else{

        timerSeconds = 0;

        currentCardHasTimer = false;
        timerDoneForCurrentCard = false;
        timerAwaitingConfirm = false;

        timerAction.classList.remove("show");

    }


    bigFooter.textContent =
        "LOVE CARD · " +
        card.type;

}


/* =====================================================
   外部关闭卡牌
   ===================================================== */

function overlayClick(event){

    if(timerActive || timerAwaitingConfirm){
        return;
    }

    if(cardOpening){
        return;
    }

    if(cardCloseLocked){
        return;
    }

    if(
        event.target.closest(".big-card-wrap")
    ){
        return;
    }

    /* 倒计时牌：完成倒计时并点过确定后才能点外部关闭 */
    if(
        currentCardHasTimer &&
        !timerDoneForCurrentCard
    ){
        return;
    }

    closeCard(true);

}


/* =====================================================
   关闭卡牌
   ===================================================== */

function closeCard(markCompleted, forceClose){

    if(
        (timerActive || timerAwaitingConfirm) &&
        !forceClose
    ){
        return;
    }

    if(
        !forceClose &&
        (cardOpening || cardCloseLocked)
    ){
        return;
    }

    if(
        !forceClose &&
        currentCardHasTimer &&
        !timerDoneForCurrentCard
    ){
        return;
    }

    if(forceClose){
        closeTimer(false);
    }

    if(currentCardIndex === null){

        overlay.classList.remove(
            "show",
            "instant"
        );

        overlay.style.display = "none";

        return;

    }


    if(markCompleted){

        /* 先后牌关闭后发牌 */
        if(isPriorityCard){

            isPriorityCard = false;
            currentCardIndex = null;

            overlay.classList.remove("show","instant");
            bigCard.classList.remove("reveal");
            bigCardWrap.classList.remove("spinning");
            clearTimeout(cardCloseUnlockTimer);
            cardCloseUnlockTimer = null;
            cardOpening = false;
            cardCloseLocked = false;

            setTimeout(() => {
                if(!overlay.classList.contains("show")){
                    overlay.style.display = "none";
                }
            },280);

            if(!forceClose){
                goBackLayer();
            }

            setTimeout(() => {
                runDealAnimation();
            },300);

            return;

        }

        const smallCard =
            document.querySelector(
                `.love-card[data-index="${currentCardIndex}"]`
            );

        if(
            smallCard &&
            !smallCard.classList.contains("flipped")
        ){

            smallCard.classList.add("flipped");

            const drawn =
                currentRoundCards[currentCardIndex];

            if(
                drawn &&
                drawn.categoryId === "penalty_drink"
            ){

                if(currentTurn === "girl"){
                    girlDrinks += 1;
                }else if(currentTurn === "boy"){
                    boyDrinks += 1;
                }

                saveSessionStats();

            }

            completedCount++;

            switchTurn();
            updateDrawProgress();

            if(completedCount >= CARDS_PER_ROUND){

                setTimeout(() => {

                    shuffleArea.classList.add("show");
                    updateRoundDisplay();

                },220);

            }

        }

    }


    overlay.classList.remove(
        "show",
        "instant"
    );

    bigCard.classList.remove("reveal");

    bigCardWrap.classList.remove("spinning");

    clearTimeout(cardCloseUnlockTimer);

    cardCloseUnlockTimer = null;

    cardOpening = false;

    cardCloseLocked = false;

    setTimeout(() => {

        if(
            !overlay.classList.contains("show")
        ){

            overlay.style.display = "none";

        }

    },280);

    currentCardIndex = null;

    /*
     * 仅点外部/UI 关闭时同步 history。
     * 系统返回（forceClose）已在 popstate 里处理，不能再 back。
     */
    if(!forceClose){
        goBackLayer();
    }

}


/* =====================================================
   倒计时
   ===================================================== */

function startTimer(){

    if(timerActive || timerAwaitingConfirm){
        return;
    }

    if(
        !timerSeconds ||
        timerSeconds <= 0
    ){
        return;
    }

    try{

        const AudioContext =
            window.AudioContext ||
            window.webkitAudioContext;

        if(AudioContext){

            if(!audioContext){
                audioContext = new AudioContext();
            }

            if(audioContext.state === "suspended"){
                audioContext.resume();
            }

        }

    }catch(error){}

    timerRemaining =
        timerSeconds;

    timerActive = true;
    timerAwaitingConfirm = false;

    timerTime.textContent =
        formatTime(timerRemaining);

    timerCancelBtn.textContent =
        "结束计时";

    timerOverlay.classList.add("show");

    if(
        !history.state ||
        history.state.page !== "timer"
    ){
        pushLayer("timer");
    }

    clearInterval(timerInterval);

    timerInterval =
        setInterval(() => {

            timerRemaining--;

            timerTime.textContent =
                formatTime(timerRemaining);

            if(timerRemaining <= 0){

                finishTimer();

            }

        },1000);

}


function finishTimer(){

    clearInterval(timerInterval);

    timerInterval = null;

    timerRemaining = 0;

    timerActive = false;

    /* 不自动关闭，等待点「确定」 */
    timerAwaitingConfirm = true;

    timerTime.textContent =
        formatTime(0);

    timerCancelBtn.textContent =
        "确定";

    playTimerFinishedSound();
    mediumVibrate();

}


function confirmTimerPanel(){

    timerAwaitingConfirm = false;
    timerActive = false;

    clearInterval(timerInterval);
    timerInterval = null;

    timerOverlay.classList.remove("show");

    timerDoneForCurrentCard = true;

    timerCancelBtn.textContent =
        "结束计时";

    if(
        history.state &&
        history.state.loveCard === true &&
        history.state.page === "timer"
    ){
        goBackLayer();
    }

}


function closeTimer(showMessage){

    clearInterval(timerInterval);

    timerInterval = null;

    timerRemaining = 0;

    timerActive = false;
    timerAwaitingConfirm = false;

    timerOverlay.classList.remove("show");

    timerCancelBtn.textContent =
        "结束计时";

    if(showMessage){
        showToast("已结束计时");
    }

}

function onTimerButtonClick(){

    if(timerAwaitingConfirm){
        confirmTimerPanel();
        return;
    }

    if(timerActive){
        finishTimer();
        return;
    }

}


/* =====================================================
   洗牌
   ===================================================== */

function shuffleCards(){

    if(dealBusy || gamePhase === "dealing" || gamePhase === "collecting"){
        return;
    }

    closeTimer(false);

    clearTimeout(cardCloseUnlockTimer);

    cardCloseUnlockTimer = null;

    cardOpening = false;

    cardCloseLocked = false;

    shuffleArea.classList.remove("show");

    lightVibrate();

    /* 收牌回中间 → 先后牌 → 再发牌；轮数在收牌结束时 +1 */
    runCollectThenPriority();

}


/* =====================================================
   Toast
   ===================================================== */

let toastTimer = null;

function showToast(message){

    const toast =
        document.getElementById("toast");

    toast.textContent =
        message;

    toast.classList.add("show");

    clearTimeout(toastTimer);

    toastTimer =
        setTimeout(() => {

            toast.classList.remove("show");

        },1800);

}
