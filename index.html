<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">

<title>恋爱签</title>

<meta name="theme-color" content="#fcecf3">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "PingFang SC",
        "Microsoft YaHei",
        sans-serif;
    color:#5f4652;
}

body{
    background:
        radial-gradient(
            circle at 50% -10%,
            #ffffff 0%,
            #fff8fb 35%,
            #fcecf3 70%,
            #f8e3ed 100%
        );
}

button,
input,
textarea{
    font-family:inherit;
}

button{
    cursor:pointer;
    -webkit-user-select:none;
    user-select:none;
    touch-action:manipulation;
}

.page{
    position:absolute;
    inset:0;
    overflow:hidden;
}


/* =====================================================
   背景
   ===================================================== */

.glow{
    position:absolute;
    border-radius:50%;
    filter:blur(55px);
    pointer-events:none;
}

.glow.one{
    width:180px;
    height:180px;
    background:rgba(255,190,211,.27);
    top:-60px;
    left:-50px;
}

.glow.two{
    width:220px;
    height:220px;
    background:rgba(248,211,225,.28);
    right:-80px;
    top:25%;
}

.glow.three{
    width:190px;
    height:190px;
    background:rgba(255,220,231,.30);
    bottom:-80px;
    left:20%;
}

.heart{
    position:absolute;
    color:rgba(213,130,158,.15);
    font-family:serif;
    pointer-events:none;
    user-select:none;
}

.heart.h1{
    top:13%;
    left:8%;
    font-size:20px;
    transform:rotate(-15deg);
}

.heart.h2{
    top:27%;
    right:9%;
    font-size:15px;
    transform:rotate(18deg);
}

.heart.h3{
    bottom:22%;
    left:10%;
    font-size:17px;
    transform:rotate(12deg);
}

.heart.h4{
    bottom:12%;
    right:12%;
    font-size:22px;
    transform:rotate(-12deg);
}


/* =====================================================
   首页
   ===================================================== */

#homePage{
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:
        calc(env(safe-area-inset-top) + 45px)
        24px
        calc(env(safe-area-inset-bottom) + 28px);
}

.home-title{
    text-align:center;
    flex-shrink:0;
}

.home-title .en{
    font-family:Georgia,serif;
    font-size:11px;
    letter-spacing:4px;
    color:#c58ca2;
    margin-bottom:9px;
}

.home-title h1{
    margin:0;
    font-family:
        "STKaiti",
        "KaiTi",
        "FZKai-Z03",
        serif;
    font-size:40px;
    font-weight:400;
    letter-spacing:7px;
    color:#654957;
}

.home-title p{
    margin:12px 0 0;
    font-family:
        "STKaiti",
        "KaiTi",
        serif;
    font-size:14px;
    letter-spacing:1px;
    color:#a77c8d;
}

.home-card-area{
    flex:1;
    width:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:0;
}

.card-stack{
    position:relative;
    width:190px;
    height:270px;
    animation:cardFloat 4s ease-in-out infinite;
}

.stack-card{
    position:absolute;
    width:190px;
    height:270px;
    border-radius:22px;
    box-shadow:0 18px 45px rgba(143,84,108,.13);
}

.stack-card.back1{
    background:linear-gradient(145deg,#f3d8e3,#edd0dd);
    transform:translate(-12px,7px) rotate(-7deg);
}

.stack-card.back2{
    background:linear-gradient(145deg,#f8e8ee,#f2dce6);
    transform:translate(12px,5px) rotate(7deg);
}

.main-card{
    position:absolute;
    inset:0;
    border-radius:22px;
    background:
        radial-gradient(
            circle at 20% 15%,
            rgba(255,255,255,.9),
            transparent 32%
        ),
        linear-gradient(145deg,#fffdfd,#fdf0f5);
    box-shadow:
        0 20px 50px rgba(143,84,108,.17),
        inset 0 0 0 1px rgba(255,255,255,.9);
    overflow:hidden;
}

.main-card:before{
    content:"";
    position:absolute;
    inset:10px;
    border:1px solid rgba(193,132,155,.25);
    border-radius:16px;
    pointer-events:none;
}

.corner{
    position:absolute;
    color:#d7a4b8;
    font-family:serif;
    font-size:13px;
}

.corner.c1{top:18px;left:18px}
.corner.c2{top:18px;right:18px}
.corner.c3{bottom:18px;left:18px}
.corner.c4{bottom:18px;right:18px}

.card-center{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    width:82px;
    height:82px;
    border-radius:50%;
    background:rgba(246,214,226,.45);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:34px;
    color:#d38da9;
}

.main-card .love-card-title{
    position:absolute;
    left:0;
    right:0;
    bottom:46px;
    text-align:center;
    font-family:"STKaiti","KaiTi",serif;
    font-size:24px;
    letter-spacing:5px;
    color:#765261;
}

.main-card .love-card-sub{
    position:absolute;
    left:0;
    right:0;
    bottom:23px;
    text-align:center;
    font-family:Georgia,serif;
    font-size:7px;
    letter-spacing:2px;
    color:#c08aa0;
}

@keyframes cardFloat{
    0%,100%{transform:translateY(0)}
    50%{transform:translateY(-8px)}
}

.home-actions{
    width:100%;
    flex-shrink:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:15px;
}

.primary-btn{
    width:min(280px,86vw);
    height:52px;
    border:none;
    border-radius:28px;
    background:linear-gradient(135deg,#d993ad,#c77f9b);
    color:white;
    font-size:15px;
    letter-spacing:2px;
    box-shadow:0 10px 25px rgba(190,113,143,.22);
}

.primary-btn:active{
    transform:scale(.97);
}

.secondary-btn{
    border:none;
    background:transparent;
    color:#ad7c8e;
    font-size:13px;
    letter-spacing:1px;
    padding:5px 12px;
}


/* =====================================================
   通用页面
   ===================================================== */

.sub-page{
    display:none;
    flex-direction:column;
    padding:
        calc(env(safe-area-inset-top) + 15px)
        18px
        calc(env(safe-area-inset-bottom) + 20px);
}

.page-header{
    position:relative;
    width:100%;
    height:48px;
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:center;
}

.page-header-title{
    font-family:"STKaiti","KaiTi",serif;
    font-size:21px;
    letter-spacing:4px;
    color:#684c59;
}


/* =====================================================
   我的卡牌
   ===================================================== */

#collectionPage{
    background:
        radial-gradient(
            circle at 50% -10%,
            #ffffff 0%,
            #fff8fb 35%,
            #fcecf3 70%,
            #f8e3ed 100%
        );
}

.collection-intro{
    flex-shrink:0;
    margin-top:10px;
    padding:0 5px;
}

.collection-intro h2{
    margin:0;
    font-size:20px;
    font-weight:500;
    color:#684b58;
}

.collection-intro p{
    margin:7px 0 0;
    font-size:12px;
    color:#a98a96;
}

.category-list{
    flex:1;
    min-height:0;
    overflow-y:auto;
    padding:18px 2px 10px;
    scrollbar-width:none;
}

.category-list::-webkit-scrollbar{
    display:none;
}

.category-item{
    width:100%;
    min-height:72px;
    border:1px solid rgba(213,177,191,.25);
    border-radius:16px;
    background:rgba(255,255,255,.72);
    margin-bottom:10px;
    padding:12px 14px;
    display:flex;
    align-items:center;
    text-align:left;
    box-shadow:0 5px 18px rgba(143,84,108,.05);
    transition:transform .15s ease,background .15s ease;
}

.category-item:active{
    transform:scale(.985);
    background:rgba(255,255,255,.9);
}

.category-icon{
    width:42px;
    height:42px;
    border-radius:13px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:21px;
    flex-shrink:0;
    margin-right:12px;
}

.category-item:nth-child(1) .category-icon{background:#edf6dc}
.category-item:nth-child(2) .category-icon{background:#f8e5ed}
.category-item:nth-child(3) .category-icon{background:#f9e4df}
.category-item:nth-child(4) .category-icon{background:#e6edf8}
.category-item:nth-child(5) .category-icon{background:#ece5f2}
.category-item:nth-child(6) .category-icon{background:#fff0d7}

.category-info{
    flex:1;
    min-width:0;
}

.category-name{
    font-size:16px;
    font-weight:500;
    color:#6b4e5b;
}

.category-count{
    margin-top:5px;
    font-size:11px;
    color:#ad929d;
}

.category-arrow{
    color:#c391a4;
    font-size:22px;
    margin-left:8px;
}

.collection-bottom{
    flex-shrink:0;
    text-align:center;
    padding:5px 0 3px;
}

.collection-total{
    font-size:10px;
    color:#b99aa7;
    letter-spacing:1px;
}


/* =====================================================
   编辑
   ===================================================== */

#editorPage{
    display:none;
    flex-direction:column;
}

.editor-summary{
    flex-shrink:0;
    margin:10px 0 14px;
    padding-left:3px;
}

.editor-summary-top{
    display:flex;
    align-items:center;
}

.editor-summary-icon{
    width:42px;
    height:42px;
    border-radius:13px;
    background:rgba(255,255,255,.72);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:22px;
    margin-right:10px;
}

.editor-summary-name{
    font-size:20px;
    font-weight:500;
    color:#684c59;
}

.editor-summary-count{
    margin-top:4px;
    font-size:11px;
    color:#ad929d;
}

.add-content-box{
    flex-shrink:0;
    width:100%;
    background:rgba(255,255,255,.72);
    border:1px solid rgba(213,177,191,.25);
    border-radius:17px;
    padding:12px;
    box-shadow:0 5px 18px rgba(143,84,108,.05);
}

.content-input{
    display:block;
    width:100%;
    height:150px;
    min-height:150px;
    max-height:240px;
    resize:vertical;
    border:1px solid rgba(208,173,188,.25);
    outline:none;
    border-radius:13px;
    background:#fbf3f7;
    padding:13px;
    font-size:15px;
    line-height:1.75;
    color:#705563;
}

.content-input:focus{
    border-color:rgba(195,132,158,.45);
    background:#fffafd;
}

.content-input::placeholder{
    color:#bda5af;
}

.add-content-row{
    display:flex;
    justify-content:flex-end;
    margin-top:10px;
}

.add-btn{
    height:40px;
    padding:0 22px;
    border:none;
    border-radius:20px;
    background:linear-gradient(135deg,#d993ad,#c77f9b);
    color:white;
    font-size:13px;
    box-shadow:0 6px 15px rgba(190,113,143,.16);
}

.add-btn:active{
    transform:scale(.96);
}

.content-list{
    flex:1;
    min-height:0;
    overflow-y:auto;
    margin-top:13px;
    padding:0 1px 20px;
    scrollbar-width:none;
}

.content-list::-webkit-scrollbar{
    display:none;
}

.content-empty{
    padding-top:55px;
    text-align:center;
    color:#b99da8;
}

.content-empty-icon{
    font-size:27px;
    margin-bottom:9px;
}

.content-empty-text{
    font-size:12px;
    line-height:1.8;
}


/* =====================================================
   内容列表
   ===================================================== */

.content-item{
    width:100%;
    min-height:46px;
    margin-bottom:7px;
    padding:8px 8px 8px 9px;

    display:grid;
    grid-template-columns:32px minmax(0,1fr) 30px;
    align-items:center;
    column-gap:5px;

    background:rgba(255,255,255,.72);
    border:1px solid rgba(213,177,191,.2);
    border-radius:11px;

    box-shadow:0 3px 10px rgba(143,84,108,.035);
}

.content-number{
    width:32px;
    min-width:32px;
    height:26px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:8px;
    background:rgba(246,224,233,.55);

    color:#ad7d90;
    font-size:12px;
    font-weight:500;
    line-height:1;

    white-space:nowrap;
}

.content-text{
    min-width:0;
    display:block;

    font-size:14px;
    line-height:1.55;
    color:#735764;

    white-space:pre-wrap;
    word-break:break-word;

    cursor:pointer;
    user-select:none;
    -webkit-user-select:none;
}

.content-text:active{
    opacity:.7;
}

.item-actions{
    width:30px;
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
}

.item-action.delete-action{
    width:28px;
    height:28px;

    border:1px solid rgba(190,143,160,.35);
    border-radius:7px;

    background:rgba(255,248,251,.9);
    color:#b78396;

    font-size:18px;
    font-weight:300;
    line-height:1;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:0;
}

.item-action.delete-action:active{
    transform:scale(.9);
    background:#f8e8ee;
}


/* =====================================================
   删除弹窗
   ===================================================== */

.delete-modal{
    position:fixed;
    inset:0;
    z-index:400;

    display:none;
    align-items:center;
    justify-content:center;

    background:rgba(81,48,62,.24);

    backdrop-filter:blur(7px);
    -webkit-backdrop-filter:blur(7px);

    padding:25px;
}

.delete-modal.show{
    display:flex;
}

.delete-box{
    width:180px;
    background:linear-gradient(145deg,#fffefe,#f9edf2);
    border-radius:20px;
    padding:10px;

    box-shadow:0 20px 50px rgba(75,38,53,.22);

    display:flex;
    flex-direction:column;
    gap:8px;
}

.delete-confirm-btn,
.delete-cancel-btn{
    width:100%;
    height:42px;
    border-radius:14px;
    font-size:14px;
    border:1px solid rgba(193,132,155,.22);
    background:white;
    color:#ad7c8e;
}

.delete-confirm-btn{
    border:none;
    color:white;
    background:linear-gradient(135deg,#d993ad,#c77f9b);
}

.delete-confirm-btn:active,
.delete-cancel-btn:active{
    transform:scale(.97);
}


/* =====================================================
   游戏
   ===================================================== */

#drawPage{
    display:none;
    flex-direction:column;
    padding:
        calc(env(safe-area-inset-top) + 20px)
        18px
        calc(env(safe-area-inset-bottom) + 24px);
}

.draw-header{
    position:relative;
    width:100%;
    height:42px;
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:center;
}

.draw-header-title{
    font-family:"STKaiti","KaiTi",serif;
    font-size:21px;
    letter-spacing:4px;
    color:#684c59;
}

.draw-intro{
    text-align:center;
    flex-shrink:0;
    margin-top:17px;
}

.draw-intro h2{
    margin:0;
    font-family:"STKaiti","KaiTi",serif;
    font-size:23px;
    font-weight:400;
    letter-spacing:3px;
    color:#684b58;
}

.draw-intro p{
    margin:8px 0 0;
    font-size:12px;
    letter-spacing:1px;
    color:#ad8493;
}

.cards-board{
    width:100%;
    flex:1;
    min-height:0;

    display:grid;
    grid-template-columns:repeat(3,1fr);
    grid-template-rows:repeat(2,auto);

    gap:22px 9px;

    align-content:center;
    justify-items:center;

    padding:8px 5px;
}

.love-card{
    position:relative;
    width:100%;
    max-width:108px;
    aspect-ratio:.705;

    border-radius:17px;
    border:0;
    padding:0;

    background:none;

    perspective:900px;

    transition:
        transform .25s ease,
        opacity .25s ease;
}

.love-card:active{
    transform:scale(.94);
}

.love-card-inner{
    position:absolute;
    inset:0;
    border-radius:17px;

    transform-style:preserve-3d;

    transition:
        transform .65s cubic-bezier(.2,.8,.2,1);
}

.love-card.flipped .love-card-inner{
    transform:rotateY(180deg);
}

.card-face{
    position:absolute;
    inset:0;

    border-radius:17px;

    backface-visibility:hidden;
    -webkit-backface-visibility:hidden;

    overflow:hidden;
}

.card-back{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    box-shadow:0 10px 25px rgba(130,75,98,.13);
}

.card-back:before{
    content:"";
    position:absolute;
    inset:7px;
    border-radius:12px;
    border:1px solid rgba(255,255,255,.48);
    pointer-events:none;
}

.back-symbol{
    font-family:Georgia,serif;
    font-size:27px;
    color:rgba(255,255,255,.88);
    margin-bottom:10px;
}

.back-label{
    font-family:Georgia,serif;
    font-size:7px;
    letter-spacing:2px;
    color:rgba(255,255,255,.8);
}

.card-color-1 .card-back{
    background:linear-gradient(145deg,#B7E35A,#8FBE35);
}

.card-color-2 .card-back{
    background:linear-gradient(145deg,#B84A3A,#8F3028);
}

.card-color-3 .card-back{
    background:linear-gradient(145deg,#3FBF7F,#238A5B);
}

.card-color-4 .card-back{
    background:linear-gradient(145deg,#C49A3A,#8F6A20);
}

.card-color-5 .card-back{
    background:linear-gradient(145deg,#81D8D0,#49B8B0);
}

.card-color-6 .card-back{
    background:linear-gradient(145deg,#7A5140,#4E3025);
}

.card-front{
    transform:rotateY(180deg);

    background:linear-gradient(145deg,#fffefe,#faedf2);

    border:1px solid rgba(196,132,155,.2);

    box-shadow:0 10px 25px rgba(130,75,98,.12);

    display:flex;
    flex-direction:column;
    align-items:center;

    padding:15px 10px;
}

.card-front:before{
    content:"";
    position:absolute;
    inset:6px;
    border:1px solid rgba(193,132,155,.18);
    border-radius:12px;
    pointer-events:none;
}

.card-type{
    position:relative;
    font-size:8px;
    letter-spacing:2px;
    color:#c18ca1;
    margin-top:3px;
}

.card-icon{
    position:relative;
    font-size:25px;
    margin-top:15px;
}

.card-name{
    position:relative;
    margin-top:8px;

    font-family:"STKaiti","KaiTi",serif;
    font-size:17px;
    letter-spacing:2px;
    color:#72505e;
}


/* =====================================================
   洗牌
   ===================================================== */

.shuffle-area{
    flex-shrink:0;
    height:48px;

    display:flex;
    align-items:center;
    justify-content:center;

    opacity:0;
    pointer-events:none;

    transform:translateY(8px);

    transition:
        opacity .35s ease,
        transform .35s ease;
}

.shuffle-area.show{
    opacity:1;
    pointer-events:auto;
    transform:translateY(0);
}

.shuffle-btn{
    height:40px;
    min-width:120px;
    padding:0 25px;

    border:1px solid rgba(193,132,155,.28);
    border-radius:22px;

    background:rgba(255,255,255,.62);

    color:#a87387;
    font-size:13px;
    letter-spacing:2px;

    box-shadow:0 7px 20px rgba(150,90,112,.08);
}

.shuffle-btn:active{
    transform:scale(.94);
}


/* =====================================================
   大卡牌
   ===================================================== */

.card-overlay{
    position:fixed;
    inset:0;
    z-index:100;

    display:none;

    align-items:center;
    justify-content:center;

    background:rgba(81,48,62,.28);

    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);

    opacity:0;

    transition:opacity .28s ease;

    padding:
        calc(env(safe-area-inset-top) + 25px)
        20px
        calc(env(safe-area-inset-bottom) + 25px);
}

.card-overlay.show{
    opacity:1;
}

.big-card-wrap{
    position:relative;

    width:min(330px,86vw);
    height:min(500px,76vh);
    min-height:400px;

    perspective:1400px;

    transform:scale(.58) rotate(-5deg);
    opacity:0;

    z-index:1;
}

/* =====================================================

   ===================================================== */

const STORAGE_KEY =
    "loveCard_customContents_v3";

function createDefaultData(){

    return {
        lucky:[],
        truth:[],
        dare:[],
        game:[],
        punishment:[],
        action:[]
    };

}

function loadData(){

    try{

        const saved =
            localStorage.getItem(STORAGE_KEY);

        if(!saved){
            return createDefaultData();
        }

        const parsed =
            JSON.parse(saved);

        const data =
            createDefaultData();

        categories.forEach(category => {

            if(Array.isArray(parsed[category.id])){

                data[category.id] =
                    parsed[category.id]
                        .map(item => String(item));

            }

        });

        return data;

    }catch(error){

        return createDefaultData();

    }

}

let customData = loadData();

function saveData(){

    try{

        localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify(customData)
        );

    }catch(error){

        showToast("保存失败，请检查浏览器存储");

    }

}

/* =====================================================
   倒计时提示音
   ===================================================== */

/*
 * 使用浏览器自带的 Web Audio API。
 *
 * 不需要外部音频文件。
 * 不需要网络。
 *
 * 倒计时结束时：
 * 滴 —— 滴 —— 滴
 *
 * 总时长约 2 秒。
 */

let audioContext = null;

function playTimerFinishedSound(){

    try{

        const AudioContext =
            window.AudioContext ||
            window.webkitAudioContext;

        if(!AudioContext){
            return;
        }

        if(!audioContext){

            audioContext =
                new AudioContext();

        }

        if(audioContext.state === "suspended"){

            audioContext.resume();

        }

        const now =
            audioContext.currentTime;

        /*
         * 三声提示音
         *
         * 每一声：
         * 约 0.18 秒
         *
         * 间隔：
         * 约 0.48 秒
         */

        const beepTimes = [
            0,
            0.55,
            1.10
        ];

        beepTimes.forEach((offset,index) => {

            const oscillator =
                audioContext.createOscillator();

            const gain =
                audioContext.createGain();

            oscillator.type = "sine";

            /*
             * 三声略微不同，
             * 听起来更自然。
             */
            oscillator.frequency.value =
                index === 2 ? 880 : 820;

            gain.gain.setValueAtTime(
                0,
                now + offset
            );

            gain.gain.linearRampToValueAtTime(
                0.16,
                now + offset + 0.025
            );

            gain.gain.linearRampToValueAtTime(
                0,
                now + offset + 0.20
            );

            oscillator.connect(gain);
            gain.connect(audioContext.destination);

            oscillator.start(
                now + offset
            );

            oscillator.stop(
                now + offset + 0.22
            );

        });

    }catch(error){

        /*
         * 如果手机浏览器不支持音频，
         * 不影响倒计时和游戏其他功能。
         */

    }

}

    if(timerActive){

        closeTimer(false);

        history.pushState(
            {
                loveCard:true,
                page:"draw"
            },
            "",
            location.href
        );

        return;

    }


    if(
        event.state &&
        event.state.loveCard === true &&
        event.state.page === "home"
    ){

        backHome();
        return;

    }


    if(
        event.state &&
        event.state.loveCard === true &&
        event.state.page === "collection"
    ){

        backCollection();
        return;

    }


    if(
        event.state &&
        event.state.loveCard === true &&
        event.state.page === "editor"
    ){

        currentPage = "editor";

        showOnlyPage("editor");

        return;

    }


    if(
        event.state &&
        event.state.loveCard === true &&
        event.state.page === "draw"
    ){

        currentPage = "draw";

        showOnlyPage("draw");

        return;

    }


    history.replaceState(
        {
            loveCard:true,
            page:"home"
        },
        "",
        location.href
    );

    backHome();

});

/* =====================================================
   Fisher-Yates
   ===================================================== */

function shuffleArray(array){

    const result = [...array];

    for(
        let i = result.length - 1;
        i > 0;
        i--
    ){

        const j =
            Math.floor(
                Math.random() * (i + 1)
            );

        [
            result[i],
            result[j]
        ] =
        [
            result[j],
            result[i]
        ];

    }

    return result;

}

/* =====================================================
   时间解析
   ===================================================== */

function parseTimer(text){

    const source =
        String(text);

    const explicit =
        source.match(
            /[【\[]\s*(?:计时|倒计时)\s*[:：]\s*(?:(\d+)\s*分(?:钟)?\s*)?(?:(\d+)\s*秒)?\s*[】\]]/i
        );

    if(explicit){

        const minutes =
            Number(explicit[1] || 0);

        const seconds =
            Number(explicit[2] || 0);

        const total =
            minutes * 60 + seconds;

        if(
            total > 0 &&
            total <= 3600
        ){

            return {

                seconds:total,

                display:
                    source
                        .replace(explicit[0],"")
                        .trim()

            };

        }

    }


    const minuteSecond =
        source.match(
            /(\d+)\s*分(?:钟)?\s*(\d+)\s*秒/
        );

    if(minuteSecond){

        const total =
            Number(minuteSecond[1]) * 60 +
            Number(minuteSecond[2]);

        if(
            total > 0 &&
            total <= 3600
        ){

            return {
                seconds:total,
                display:source
            };

        }

    }


    const minutesOnly =
        source.match(
            /(\d+)\s*分钟?/
        );

    if(minutesOnly){

        const total =
            Number(minutesOnly[1]) * 60;

        if(
            total > 0 &&
            total <= 3600
        ){

            return {
                seconds:total,
                display:source
            };

        }

    }


    const secondsOnly =
        source.match(
            /(\d+)\s*秒/
        );

    if(secondsOnly){

        const total =
            Number(secondsOnly[1]);

        if(
            total > 0 &&
            total <= 3600
        ){

            return {
                seconds:total,
                display:source
            };

        }

    }

    return null;

}


/* =====================================================
   时间格式
   ===================================================== */

function formatTime(totalSeconds){

    const safe =
        Math.max(
            0,
            Math.floor(totalSeconds)
        );

    const minutes =
        Math.floor(safe / 60);

    const seconds =
        safe % 60;

    return (
        String(minutes).padStart(2,"0") +
        ":" +
        String(seconds).padStart(2,"0")
    );

}


/* =====================================================
   打开卡牌
   ===================================================== */

function openCard(index){

    /*
     * 如果正在抽牌动画，
     * 或者卡牌刚刚翻开后的 1 秒锁定期，
     * 不允许再次操作。
     */
    if(
        cardOpening ||
        cardCloseLocked ||
        timerActive
    ){
        return;
    }

    const card =
        currentRoundCards[index];

    if(!card){
        return;
    }

    const smallCard =
        document.querySelector(
            `.love-card[data-index="${index}"]`
        );

    if(!smallCard){
        return;
    }

    const alreadyOpened =
        smallCard.classList.contains("flipped");

    currentCardIndex = index;

    if(!alreadyOpened){

        /*
         * 开始抽牌。
         *
         * 从这里开始：
         * cardOpening = true
         * cardCloseLocked = true
         *
         * 所以整个动画期间，
         * 点击外部都不会关闭。
         */
        cardOpening = true;

        cardCloseLocked = true;

        clearTimeout(cardCloseUnlockTimer);

        cardCloseUnlockTimer = null;

        overlay.classList.remove("instant");

        bigCard.classList.remove("reveal");

        bigCardWrap.classList.remove("spinning");

        fillBigCard(card);

        overlay.style.display = "flex";

        requestAnimationFrame(() => {

            overlay.classList.add("show");

        });

        /*
         * 250ms 后开始旋转动画。
         */
        setTimeout(() => {

            if(!overlay.classList.contains("show")){
                return;
            }

            bigCardWrap.classList.add("spinning");

        },250);


        /*
         * 1400ms：
         * 原本的抽牌动画结束，
         * 让大卡牌翻到正面。
         *
         * 但是这里仍然不能关闭。
         *
         * 接下来继续锁定 1000ms。
         */
        setTimeout(() => {

            if(!overlay.classList.contains("show")){

                cardOpening = false;

                cardCloseLocked = false;

                return;

            }

            bigCardWrap.classList.remove("spinning");

            bigCard.classList.add("reveal");

            cardOpening = false;

            /*
             * 翻牌完成后继续锁定 1 秒。
             */
            cardCloseLocked = true;

            clearTimeout(cardCloseUnlockTimer);

            cardCloseUnlockTimer =
                setTimeout(() => {

                    cardCloseLocked = false;

                    cardCloseUnlockTimer = null;

                },1000);

        },1400);

        return;

    }


    /*
     * 已经翻过的卡牌。
     */
    cardOpening = false;

    cardCloseLocked = false;

    clearTimeout(cardCloseUnlockTimer);

    cardCloseUnlockTimer = null;

    fillBigCard(card);

    overlay.classList.add("instant");

    overlay.style.display = "flex";

    requestAnimationFrame(() => {

        overlay.classList.add("show");

        bigCard.classList.add("reveal");

    });

}


/* =====================================================
   填充大卡
   ===================================================== */

function fillBigCard(card){

    bigBack.className =
        "big-face big-back";

    bigBack.classList.add(card.color);

    bigSymbol.textContent =
        card.symbol;

    bigBackTitle.textContent =
        card.type;

    bigBackEn.textContent =
        card.english;

    bigType.textContent =
        card.english.replace(" CARD","");

    bigIcon.textContent =
        card.icon;

    bigTitle.textContent =
        card.type;


    const timerInfo =
        parseTimer(card.description);


    bigDescription.innerHTML =
        escapeHTML(
            timerInfo
                ? timerInfo.display
                : card.description
        ).replace(
            /\n/g,
            "<br>"
        );


    if(timerInfo){

        timerSeconds =
            timerInfo.seconds;

        timerStartBtn.textContent =
            "⏱ 开始倒计时 · " +
            formatTime(timerInfo.seconds);

        timerAction.classList.add("show");

    }else{

        timerSeconds = 0;

        timerAction.classList.remove("show");

    }


    bigFooter.textContent =
        "LOVE CARD · " +
        card.type;

}


/* =====================================================
   外部关闭卡牌
   ===================================================== */

function overlayClick(event){

    /*
     * 倒计时期间不允许关闭。
     */
    if(timerActive){
        return;
    }

    /*
     * 抽牌动画期间不允许关闭。
     */
    if(cardOpening){
        return;
    }

    /*
     * 翻牌完成后的额外 1 秒锁定期间，
     * 同样不允许关闭。
     */
    if(cardCloseLocked){
        return;
    }

    /*
     * 点击卡牌本身不关闭。
     */
    if(
        event.target.closest(".big-card-wrap")
    ){
        return;
    }

    /*
     * 只有满足上面所有条件，
     * 点击外部才真正关闭。
     */
    closeCard(true);

}


/* =====================================================
   关闭卡牌
   ===================================================== */

function closeCard(markCompleted){

    /*
     * 任何锁定期间，
     * 都不允许关闭。
     *
     * 这里再次检查，
     * 防止其他代码间接调用 closeCard()
     * 绕过外部点击限制。
     */
    if(
        timerActive ||
        cardOpening ||
        cardCloseLocked
    ){
        return;
    }

    if(currentCardIndex === null){

        overlay.classList.remove(
            "show",
            "instant"
        );

        overlay.style.display = "none";

        return;

    }


    if(markCompleted){

        const smallCard =
            document.querySelector(
                `.love-card[data-index="${currentCardIndex}"]`
            );

        if(
            smallCard &&
            !smallCard.classList.contains("flipped")
        ){

            smallCard.classList.add("flipped");

            completedCount++;

            if(completedCount >= 6){

                setTimeout(() => {

                    shuffleArea.classList.add("show");

                },220);

            }

        }

    }


    overlay.classList.remove(
        "show",
        "instant"
    );

    bigCard.classList.remove("reveal");

    bigCardWrap.classList.remove("spinning");

    clearTimeout(cardCloseUnlockTimer);

    cardCloseUnlockTimer = null;

    cardOpening = false;

    cardCloseLocked = false;

    setTimeout(() => {

        if(
            !overlay.classList.contains("show")
        ){

            overlay.style.display = "none";

        }

    },280);

    currentCardIndex = null;

}


/* =====================================================
   倒计时
   ===================================================== */

function startTimer(){

    if(timerActive){
        return;
    }

    if(
        !timerSeconds ||
        timerSeconds <= 0
    ){
        return;
    }

    /*
     * 在用户点击“开始倒计时”的时候，
     * 浏览器已经处于用户手势上下文中。
     *
     * 这里提前创建 / 唤醒 AudioContext，
     * 可以提高 Android 浏览器允许播放结束提示音的成功率。
     */
    try{

        const AudioContext =
            window.AudioContext ||
            window.webkitAudioContext;

        if(AudioContext){

            if(!audioContext){

                audioContext =
                    new AudioContext();

            }

            if(audioContext.state === "suspended"){

                audioContext.resume();

            }

        }

    }catch(error){

    }


    timerRemaining =
        timerSeconds;

    timerActive = true;

    timerTime.textContent =
        formatTime(timerRemaining);

    timerOverlay.classList.add("show");

    clearInterval(timerInterval);

    timerInterval =
        setInterval(() => {

            timerRemaining--;

            timerTime.textContent =
                formatTime(timerRemaining);

            if(timerRemaining <= 0){

                finishTimer();

            }

        },1000);

}


function finishTimer(){

    clearInterval(timerInterval);

    timerInterval = null;

    timerRemaining = 0;

    timerActive = false;

    timerOverlay.classList.remove("show");

    /*
     * 倒计时结束：
     * 播放 3 声提示音。
     *
     * 不再显示任何文字提示。
     */
    playTimerFinishedSound();

}


function closeTimer(showMessage){

    clearInterval(timerInterval);

    timerInterval = null;

    timerRemaining = 0;

    timerActive = false;

    timerOverlay.classList.remove("show");

    if(showMessage){
        showToast("已结束计时");
    }

}


/* =====================================================
   洗牌
   ===================================================== */

function shuffleCards(){

    closeTimer(false);

    /*
     * 洗牌时彻底解除之前卡牌的锁定状态。
     */
    clearTimeout(cardCloseUnlockTimer);

    cardCloseUnlockTimer = null;

    cardOpening = false;

    cardCloseLocked = false;

    shuffleArea.classList.remove("show");

    createNewRound();

}


/* =====================================================
   Toast
   ===================================================== */

let toastTimer = null;

function showToast(message){

    const toast =
        document.getElementById("toast");

    toast.textContent =
        message;

    toast.classList.add("show");

    clearTimeout(toastTimer);

    toastTimer =
        setTimeout(() => {

            toast.classList.remove("show");

        },1800);

}
